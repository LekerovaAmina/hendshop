# ===============================
# DEVELOPMENT PROFILE
# Environment-specific: DB, logging, error verbosity
# ===============================

# Database (PostgreSQL - local/dev)
spring.datasource.url=jdbc:postgresql://postgres:5432/handshop_db
spring.datasource.username=postgres
spring.datasource.password=123

# JPA - dev: ddl-auto update for flexibility, show SQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT - dev secret (override in prod via env)
jwt.secret=HandShop_Dev_Secret_Key_2025_Change_In_Production_123456

# Logging - verbose for development
logging.level.root=INFO
logging.level.kz.handshop=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# CORS - dev origins
cors.allowed-origins=http://localhost:*,http://127.0.0.1:*

# Error handling - verbose for debugging
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true
