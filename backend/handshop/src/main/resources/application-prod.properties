# ===============================
# PRODUCTION PROFILE
# Environment-specific: DB (env vars), logging, security
# ===============================

# Database - from environment variables
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/handshop_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}

# Connection pool - production tuning
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA - prod: validate schema, no SQL logging
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server - port from env (e.g. Heroku PORT)
server.port=${PORT:8080}

# JWT - MUST be set via environment variable in production
jwt.secret=${JWT_SECRET}

# File upload - prod directory
file.upload-dir=${FILE_UPLOAD_DIR:/var/handshop/uploads/}

# Logging - minimal in production
logging.level.root=WARN
logging.level.kz.handshop=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# CORS - prod origins from env
cors.allowed-origins=${ALLOWED_ORIGINS:https://handshop.kz}

# Error handling - hide internals from clients
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Actuator - prod exposure
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=never
