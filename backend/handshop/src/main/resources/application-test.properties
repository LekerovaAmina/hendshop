# ===============================
# TEST PROFILE (used when spring.profiles.active=test)
# ===============================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

jwt.secret=TestSecretKeyForJwtTokenValidationInUnitAndIntegrationTests12345
jwt.expiration=86400000

logging.level.root=WARN
logging.level.kz.handshop=DEBUG
